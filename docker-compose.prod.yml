services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.production
    volumes:
      - static_volume:/app/backend/staticfiles
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    volumes:
      - frontend_static:/usr/share/nginx/html

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx:/etc/nginx:ro
      - frontend_static:/usr/share/nginx/html:ro
      - static_volume:/app/backend/staticfiles:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  frontend_static:
  static_volume: