services:
  db:
    image: postgres:17
    user: postgres
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - 127.0.0.1:5432:5432

  redis:
    image: redis:7-alpine
    user: redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: [
      "redis-server", 
      "--save", "20", "1", 
      "--loglevel", "warning",
      "--appendonly", "no",
      "--maxmemory", "512mb", 
      "--maxmemory-policy", "allkeys-lru"
    ]
    ports:
      - 127.0.0.1:6379:6379

  worker:
    build:
      context: ./backend
      target: ${BUILD_TARGET:-prod}
      args:
        - BUILD_ENV=${APP_ENV:-prod}
    command: celery -A nfl worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=100
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=250000
      - CELERY_TASK_ACKS_LATE=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    build:
      context: ./backend
      target: ${BUILD_TARGET:-prod}
      args:
        - BUILD_ENV=${APP_ENV:-prod}
    command: celery -A nfl beat --loglevel=info
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-prod}
      args:
        - BUILD_ENV=${APP_ENV:-prod}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/backend/staticfiles
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CONN_MAX_AGE=${CONN_MAX_AGE}
      - USE_HTTPS=${USE_HTTPS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DJANGO_SETTINGS_MODULE=backend.settings.${APP_ENV:-production}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - 8000:8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-prod}
      args:
        - BUILD_ENV=${APP_ENV:-prod}
    volumes:
      - frontend_static:/usr/share/nginx/html
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx:/etc/nginx:ro
      - frontend_static:/usr/share/nginx/html:ro
      - static_volume:/app/backend/staticfiles:ro
    depends_on:
      - frontend
      - backend
    networks:
      - default
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  frontend_static:
  static_volume:

networks:
  default:
  dokploy-network:
    external: true