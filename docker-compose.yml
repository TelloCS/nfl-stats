services:
  db:
    image: postgres:17
    user: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - 127.0.0.1:5432:5432

  redis:
    image: redis:7-alpine
    user: redis
    restart: no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: [
      "redis-server", 
      "--save", "20", "1", 
      "--loglevel", "warning",
      "--appendonly", "no",
      "--maxmemory", "512mb", 
      "--maxmemory-policy", "allkeys-lru"
    ]
    ports:
      - 127.0.0.1:6379:6379

  worker:
    build:
      context: ./backend
      target: dev
    command: celery -A nfl worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - CELERY_WORKER_MAX_TASKS_PER_CHILD=100
      - CELERY_WORKER_MAX_MEMORY_PER_CHILD=250000
      - CELERY_TASK_ACKS_LATE=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    build:
      context: ./backend
      target: dev
    command: celery -A nfl beat --loglevel=info
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
        - ./backend:/app/backend/
        - /app/backend/staticfiles/
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings.local
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    ports:
      - 127.0.0.1:8000:8000
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - backend
    stdin_open: true
    tty: true
  
volumes:
  postgres_data:
  redis_data:
  frontend_node_modules: