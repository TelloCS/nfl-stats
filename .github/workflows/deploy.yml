name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nfl-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nfl-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nfl-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nfl-frontend:${{ github.sha }}

      - name: Trigger Dokploy Deployment
        run: |
          curl -X 'POST' \
          'https://melojello.com/api/application.deploy' \
          -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
          -H 'Content-Type: application/json' \
          -d '{ 
            "applicationId": "${{ secrets.DOKPLOY_APP_ID }}", 
            "title": "GitHub Action: ${{ github.event.head_commit.message }}",
            "description": "Commit SHA: ${{ github.sha }}"
          }'